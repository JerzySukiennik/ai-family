<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Gzowo AI">
  <title>Gzowo AI</title>
  <!--
    PLACEHOLDER MARK — Gzowo AI has no final logo yet. Built on exactly the
    same skeleton as microg-icon.svg and gedit-icon.svg so the three read as
    one family: same 824x824 content box, same translate/scale, same stroke 15,
    same G (centre 200,90, r50 — literally the same path).

    Left glyph is an aperture: a ring with a pupil. It stands in for the
    assistant the way mu stands in for "micro" and the crop-mark for "edit" —
    and "Gzowo Aperture" is already the name of this project's own visual
    language, so the symbol is inherited, not invented.

    Ring r38 + stroke 15 spans x 50.5-141.5, against mu's 52.5-139.5 — the
    same optical weight, so no re-centering is needed in the icon.
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0d0d0f"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5"
        fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
  <g transform="translate(179.4,260.9) scale(2.146)">
    <g fill="none" stroke="#fff" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round" transform="translate(0,11)">
      <circle cx="96" cy="123" r="38"/>
      <circle cx="96" cy="123" r="9" fill="#fff" stroke="none"/>
      <path d="M243 62 a50 50 0 1 0 0 56 V90 H200"/>
    </g>
  </g>
</svg>
